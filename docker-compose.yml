version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pyq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyquser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyqpassword}
      POSTGRES_DB: ${POSTGRES_DB:-pyqdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyquser} -d ${POSTGRES_DB:-pyqdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pyq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./work/docqa-backend
      dockerfile: Dockerfile
    container_name: pyq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pyquser:pyqpassword@postgres:5432/pyqdb
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/data/storage
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-pyq-super-secret-key-change-in-production}
    volumes:
      - pyq_storage:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./work/docqa-backend
      dockerfile: Dockerfile
    container_name: pyq-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://pyquser:pyqpassword@postgres:5432/pyqdb
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/data/storage
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-pyq-super-secret-key-change-in-production}
    volumes:
      - pyq_storage:/app/data/storage

  frontend:
    build:
      context: ./work/docqa-frontend
      dockerfile: Dockerfile
    container_name: pyq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  nginx:
    image: nginx:alpine
    container_name: pyq-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx/images

volumes:
  postgres_data:
  redis_data:
  pyq_storage:
  nginx_cache:
